server {
  listen 3000;
  root /usr/share/nginx/html;

  # 해시가 붙은 번들(assets/)만 오래 캐시. sb-manager·index.json·HTML 은 이름이 고정이라 매번 확인(새 스토리가 바로 보이게).
  # X-Robots-Tag: 공개 도메인이지만 사용자 기능이 없는 놀이터라 검색 색인에서 뺀다(2026-10-22 — meta·헤더·robots.txt 셋 다 없었다).
  # robots.txt Disallow 는 쓰지 않는다(막으면 noindex 를 못 읽는다). location 에 add_header 가 있으면 server 단 헤더를
  # 물려받지 않아 location 마다 적는다.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /index.html;
  }
  location = /healthz {
    access_log off;
    return 200 'ok';
  }
}
