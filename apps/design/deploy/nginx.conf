server {
  listen 3000;
  root /usr/share/nginx/html;

  # 해시가 붙은 번들(assets/)만 오래 캐시. sb-manager·index.json·HTML 은 이름이 고정이라 매번 확인(새 스토리가 바로 보이게).
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
  location = /healthz {
    access_log off;
    return 200 'ok';
  }
}
