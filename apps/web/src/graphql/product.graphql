query product($id: Int!) {
    product(id: $id) {
      id
      providerId
      category
      categoryId
      mallId
      title
      url
      detailUrl
      isHot
      isEnd
      price
      postedAt
      thumbnail
      wishlistCount
      positiveCommunityReactionCount
      negativeCommunityReactionCount
      author {
        id
        nickname
      }
      provider {
        id
        name
        nameKr
        host
      }
      viewCount
      mallName
      prices {
        id
        target
        type
        price
        createdAt
      }
      hotDealType
      isYearLowest
      hotDealIndex {
        id
        message
        highestPrice
        currentPrice
        lowestPrice
        visualConfig {
          markerPct
          q1Pct
          q3Pct
          medianPct
          isClustered
        }
      }
      isMyLike
      isMyReported
      likeCount
      dislikeCount
      isMyWishlist
      categoryName
    }
  }

fragment ProductAdditionalInfo on ProductOutput {
    id
    url
    positiveCommunityReactionCount
    negativeCommunityReactionCount
    provider {
      id
      name
      nameKr
      host
    }
    prices {
      id
      target
      type
      price
      createdAt
    }
    priceContext {
      dealPrice
      danawaPrice
      delta
      normalPriceMin
      normalPriceMax
      normalPriceMedian
      danawaProductName
      verificationStatus
      shippingIncluded
    }
    hotDealType
    isYearLowest
    hotDealIndex {
      id
      message
      highestPrice
      currentPrice
      lowestPrice
      visualConfig {
        markerPct
        q1Pct
        q3Pct
        medianPct
        isClustered
      }
    }
    commentSummary {
      additionalInfo
      option
      price
      productId
      purchaseMethod
      satisfaction
      summary
    }
  }
  query ProductAdditionalInfo($id: Int!) {
    product(id: $id) {
      ...ProductAdditionalInfo
    }
  }

fragment ProductInfo on ProductOutput {
    id
    categoryId
    categoryName
    title
    url
    detailUrl
    isProfitUrl
    profitLinkProvider
    isHot
    isEnd
    price
    postedAt
    thumbnail
    uploaderType
    content
    author {
      id
      nickname
    }
    provider {
      id
      name
      nameKr
      host
    }
    hotDealType
    isYearLowest
    viewCount
    mallName
    data
  }
  query ProductInfo($id: Int!) {
    product(id: $id) {
      ...ProductInfo
    }
  }

fragment ProductStats on ProductOutput {
    id
    isHot
    isEnd
    wishlistCount
    isMyLike
    isMyReported
    likeCount
    isMyWishlist
  }
  query ProductStats($id: Int!) {
    product(id: $id) {
      ...ProductStats
    }
  }

query QueryReportUserNames($productId: Int!) {
    reportUserNames(productId: $productId)
  }

query productGuides($productId: Int!) {
    productGuides(productId: $productId) {
      id
      title
      content
    }
  }

query QueryProducts(
    $limit: Int!
    $searchAfter: [String!]
    $startDate: DateTime
    $orderBy: ProductOrderType
    $orderOption: OrderOptionType
    $categoryId: Int
    $keyword: String
    $thumbnailType: ThumbnailType
    $isEnd: Boolean
    $isHot: Boolean
  ) {
    products(
      limit: $limit
      searchAfter: $searchAfter
      startDate: $startDate
      orderBy: $orderBy
      orderOption: $orderOption
      categoryId: $categoryId
      keyword: $keyword
      thumbnailType: $thumbnailType
      isEnd: $isEnd
      isHot: $isHot
    ) {
      id
      title
      mallId
      url
      isHot
      isEnd
      price
      providerId
      categoryId
      category
      thumbnail
      hotDealType
      isYearLowest
      provider {
        nameKr
      }
      searchAfter
      postedAt
    }
  }

