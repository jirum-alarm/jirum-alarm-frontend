# CI(.github/workflows/secret-scan.yml)가 푸시·PR 구간만, 커밋 훅(.husky/pre-commit)이 스테이징만 검사한다.
# 기본 룰은 DB 접속 URI 비밀번호를 못 잡는다 → 아래 커스텀 룰.
[extend]
useDefault = true

[[rules]]
id = "connection-string-password"
description = "DB/브로커 접속 URI 안의 비밀번호"
regex = '''(?i)\b(?:mongodb(?:\+srv)?|mysql|mariadb|postgres(?:ql)?|redis|rediss|amqps?)://[^:/\s'"@]+:([^@\s'"/]{4,})@'''
secretGroup = 1
keywords = ["://"]
  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = [
    '''(?i)^(?:password|passwd|pass|secret|changeme|example|xxx+|\*+|<[^>]+>|\$\{[^}]+\}|\$[A-Z_]+)$''',
    '''^\{[^}]+\}$''',      # f-string·템플릿 변수
    '''REDACTED''',
  ]

[[rules]]
id = "internal-network-address"
description = "사설망 IP"
regex = '''\b(?:192\.168|10\.(?:\d{1,3})|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'''
keywords = ["192.168.", "10.", "172."]

[[rules]]
id = "prod-cluster-command"
description = "운영 클러스터 kubectl 명령"
regex = '''(?i)kubectl\b[^\n]{0,40}--context["', =]+prod\b'''
keywords = ["kubectl"]

# 공개가 전제인 클라이언트 키·테스트/목 데이터·락파일 체크섬
[[allowlists]]
description = "공개 클라이언트 키·테스트 픽스처"
paths = [
  '''(^|/)Podfile\.lock$''',
  '''(^|/)google-services\.json$''',
  '''(^|/)GoogleService-Info\.plist$''',
  '''apps/web/public/firebase-messaging-sw\.js$''',
  '''apps/web/src/shared/config/firebase(\.test)?\.ts$''',
  '''apps/web/src/shared/config/indexnow\.ts$''',
  '''apps/web/src/shared/lib/customerservice/customer-service\.ts$''',
  '''apps/web/src/shared/mocks/''',
  '''(^|/)__tests__/''',
  '''\.test\.tsx?$''',
]
regexTarget = "line"
regexes = ['''NEXT_PUBLIC_FIREBASE_''']  # 빌드 인자로 넘기는 Firebase 웹 키(브라우저로 나가는 공개 값)
condition = "OR"

# 안드로이드 에뮬레이터가 «호스트 PC»를 가리키는 고정 별칭(모든 에뮬레이터 공통) — 우리 내부망 주소가 아니다.
[[allowlists]]
description = "Android 에뮬레이터 호스트 별칭 10.0.2.2"
regexTarget = "match"
regexes = ['''^10\.0\.2\.2$''']
