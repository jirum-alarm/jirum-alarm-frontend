name: mobile-ota

# main 에 푸시된 앱 JS 를 OTA(production 채널)로 바로 내보낸다.
#
# - mobile-validation(테스트·타입·린트·네이티브 지문)이 main push 로 **성공**했을 때만 돈다.
#   지문이 기준과 다르면 validation 이 실패하므로, 여기까지 왔다 = 지금 스토어 바이너리에 보내도 안전.
# - 발행 전에 boot-check 가 그 커밋의 JS 를 Release 앱에 끼워 시뮬레이터에서 실제로 켜 본다(scripts/boot-check.sh).
#   2026-10-01 CI 가 전부 초록인 OTA 가 실행 즉시 종료된 사고 — 테스트는 "켜지나" 를 안 본다.
#   수동 실행(workflow_dispatch)은 boot-check 만 돌고 발행하지 않는다.
# - 마지막 production OTA 커밋 이후 앱 번들 입력이 안 바뀌었으면 건너뛴다(changes) — validation 은 web 소스
#   변경에도 돌아서, 없으면 web 푸시마다 같은 내용 OTA 가 연달아 나간다(10/1 사고 때 유력했던 상황).
# - 켜고 끄기: 저장소 변수 MOBILE_AUTO_OTA=true 일 때만 발행한다(끄면 즉시 멈춤 — 사고 때 첫 조치).
# - 되돌리기: apps/mobile 에서 `pnpm ota:rollback`(직전 업데이트를 다시 내보낸다).
# - 필요: secrets.EXPO_TOKEN (expo.dev → Access tokens).

on:
  workflow_run:
    workflows: [mobile-validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-ota
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.18.0
  PNPM_VERSION: 10.30.3

jobs:
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.MOBILE_AUTO_OTA == 'true')
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile

      # ponytail: 경로 대조라 "번들이 실제로 바뀌었나" 의 근사 — 테스트·스크립트·네이티브만 바뀐 커밋은 건너뛰고,
      # packages 의 web 전용 변경도 OTA 로 나간다(드묾, 내용이 같아 무해). 마지막 커밋을 못 찾으면 발행 쪽으로 기운다.
      - name: App bundle inputs changed since last production OTA?
        id: diff
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          group=$(npx eas update:list --branch production --limit 1 --json --non-interactive | jq -r '.currentPage[0].group // empty')
          last=""
          [ -n "$group" ] && last=$(npx eas update:view "$group" --json | jq -r '.[0].gitCommitHash // empty')
          app=true
          # 테스트·린트 설정·문서는 어느 경로든 번들에 안 들어간다(design-system 의 eslint.js·*.test.mjs 등 — hind 세션 지적 10/10).
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null && git diff --quiet "$last" HEAD -- \
              ':(top)apps/mobile' ':(top)packages' ':(top)package.json' ':(top)pnpm-lock.yaml' \
              ':(top,exclude)apps/mobile/scripts' ':(top,exclude)apps/mobile/ios' ':(top,exclude)apps/mobile/android' \
              ':(top,glob,exclude)**/__tests__/**' ':(top,glob,exclude)**/*.test.*' ':(top,glob,exclude)**/*.md' \
              ':(top,glob,exclude)**/eslint.js' ':(top,glob,exclude)**/.eslintrc*'; then
            app=false
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "마지막 production OTA 커밋 ${last:-없음} → 앱 번들 입력 변경: $app" | tee -a "$GITHUB_STEP_SUMMARY"

  boot-check:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile

      # 네이티브는 지문이 같으면 같다 — Release 앱은 지문(+러너 Xcode)이 바뀔 때만 다시 빌드한다(~20분 → 캐시 적중 시 0).
      - name: Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Release simulator app
        id: app-cache
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/build/Build/Products/Release-iphonesimulator/jirumAlarmMobile.app
          key: ios-release-sim-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/mobile/native-fingerprint.json') }}

      - name: Set up Ruby
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Build Release simulator app
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        env:
          MOBILE_IOS_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.MOBILE_IOS_GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          set -euo pipefail
          umask 077
          node -e "const fs=require('fs');fs.writeFileSync('ios/GoogleService-Info.plist',Buffer.from(process.env.MOBILE_IOS_GOOGLE_SERVICE_INFO_PLIST_B64,'base64'))"
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
          bundle exec pod install --project-directory=ios
          # JS 는 boot-check 가 이 커밋 것으로 갈아 끼우므로 번들 단계는 건너뛴다.
          xcodebuild -workspace ios/jirumAlarmMobile.xcworkspace -scheme jirumAlarmMobile -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO SKIP_BUNDLING=1 build -quiet
          rm -f ios/GoogleService-Info.plist

      - name: Boot check (cold start ×3)
        run: bash apps/mobile/scripts/boot-check.sh apps/mobile/ios/build/Build/Products/Release-iphonesimulator/jirumAlarmMobile.app

  # 안드로이드판 — APK 의 번들만 바꿔 끼워 에뮬레이터에서 켠다(scripts/boot-check-android.sh). APK 는 지문으로 캐시.
  boot-check-android:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Cache Release APK
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: apps/mobile/android/boot-check.apk
          key: android-release-x86_64-${{ hashFiles('apps/mobile/native-fingerprint.json') }}

      - name: Set up JDK 17
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 서명은 아무 키나 — boot-check-android.sh 가 번들을 바꾼 뒤 다시 서명한다.
      - name: Build Release APK (x86_64)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        env:
          MOBILE_ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.MOBILE_ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          umask 077
          node -e "require('fs').writeFileSync('app/google-services.json',Buffer.from(process.env.MOBILE_ANDROID_GOOGLE_SERVICES_JSON_B64,'base64'))"
          keytool -genkeypair -keystore "$RUNNER_TEMP/ks" -storepass android -keypass android -alias k -keyalg RSA \
            -keysize 2048 -validity 1 -dname CN=boot-check
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/ks" -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=k -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/release/app-release.apk boot-check.apk
          rm -f app/google-services.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot check (cold start ×2)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash apps/mobile/scripts/boot-check-android.sh apps/mobile/android/boot-check.apk

  publish:
    needs: [boot-check, boot-check-android]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.MOBILE_AUTO_OTA == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile

      # validation 이 이미 봤지만 발행 직전에 한 번 더 — 발행 대상 커밋 그대로를 본다.
      - name: Native fingerprint (OTA safety)
        run: pnpm --filter mobile native:check

      - name: Publish OTA (production)
        id: publish
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s "$SHA")
          npx eas update --channel production --environment production \
            --non-interactive --message "${SHA:0:8} ${subject}"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      # 크래시 스택을 파일·줄로 읽으려면 소스맵이 필요하다. 토큰은 EAS production env(sensitive).
      # 실패해도 발행은 끝났으므로 잡을 빨갛게 만들지 않는다.
      - name: Upload Sentry source maps
        continue-on-error: true
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas env:exec production 'SENTRY_ORG=jirumalarm SENTRY_PROJECT=jirum-alarm-app SENTRY_URL=https://sentry.io/ npx sentry-expo-upload-sourcemaps dist'

      - name: Notify
        if: always()
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          OUTCOME: ${{ steps.publish.outcome }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [ -n "${MATTERMOST_WEBHOOK_URL:-}" ] || exit 0
          subject=$(git log -1 --format=%s "$SHA")
          if [ "$OUTCOME" = "success" ]; then
            msg="📲 앱 OTA 발행 — ${SHA:0:8} ${subject}. 사용자는 다음 실행(또는 포그라운드 복귀) 때 받는다. 되돌리기: apps/mobile 에서 pnpm ota:rollback"
          else
            msg="🔴 앱 OTA 발행 실패(${OUTCOME}) — ${SHA:0:8} ${subject}. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          jq -n --arg text "$msg" '{channel: "alert-deploy", text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$MATTERMOST_WEBHOOK_URL" >/dev/null
