name: mobile-validation

on:
  pull_request:
    paths:
      - .github/workflows/mobile-validation.yml
      - .npmrc
      - .nvmrc
      - apps/mobile/**
      - packages/design-system/**
      - packages/domain/**
      # 앱 테스트 다수가 web 소스를 읽어 대조한다(mypage-port-parity 등) — web 만 바뀐 커밋도 여기서 잡는다.
      - apps/web/src/**
      - apps/web/src/app/actions/agent.ts
      - apps/web/src/shared/hooks/useDevice.ts
      - apps/web/src/shared/hooks/useAppDownloadLink.tsx
      - apps/landing/src/app/components/key-visual/AppDownload.tsx
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  push:
    # ota/runtime-* 는 scripts/ota-backport.sh 가 발행 전에 같은 검사(설치·tsc·지문·jest)와 기동 확인을 돈다.
    # 옛 브랜치에선 그때의 워크플로·expo-doctor 가 지금 러너·SDK 와 안 맞아 늘 빨갰다(10/13) — 신호를 흐려서 끈다.
    branches-ignore:
      - 'ota/**'
    paths:
      - .github/workflows/mobile-validation.yml
      - .npmrc
      - .nvmrc
      - apps/mobile/**
      - packages/design-system/**
      - packages/domain/**
      # 앱 테스트 다수가 web 소스를 읽어 대조한다(mypage-port-parity 등) — web 만 바뀐 커밋도 여기서 잡는다.
      - apps/web/src/**
      - apps/web/src/app/actions/agent.ts
      - apps/web/src/shared/hooks/useDevice.ts
      - apps/web/src/shared/hooks/useAppDownloadLink.tsx
      - apps/landing/src/app/components/key-visual/AppDownload.tsx
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json

permissions:
  contents: read

env:
  NODE_VERSION: 22.18.0
  PNPM_VERSION: 10.30.3

jobs:
  mobile-js-validation:
    name: Mobile JS Validation
    runs-on: ubuntu-latest
    # 평소 6~7분. 테스트가 타이머를 남기면 jest --runInBand 가 끝나고도 그만큼 살아 있다
    # (10/13~14 react-query staleTime 30분 → 31분씩 12회). 기본값 360분까지 기다리지 않게.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Run mobile JS validation
        run: pnpm verify:mobile

      # 네이티브가 바뀌었는데 runtimeVersion 을 안 올렸으면 여기서 막는다 — 그대로 OTA 가 나가면
      # 옛 바이너리가 새 네이티브를 기대하는 JS 를 받아 실행 즉시 죽는다(mobile-ota 가 이 잡 뒤에 돈다).
      - name: Native fingerprint (OTA safety)
        run: pnpm --filter mobile native:check

  # iOS 빌드·기동은 mobile-ota 의 boot-check(Release 앱·네이티브 지문 캐시·시뮬레이터 콜드 스타트 3회)가 본다.
  # 예전 Mobile iOS Smoke 잡은 7/2(482a8c25)에 지워진 build:ios:debug:sim 을 불렀는데, 빌드 단계가 Firebase plist
  # 시크릿이 있을 때만 돌아 3개월간 건너뛰어지다가 10/9 boot-check 용 시크릿 등록으로 매 푸시 실패 → validation 이
  # 실패해 mobile-ota 가 늘 skipped 였다. 매 푸시 Debug 빌드를 되살리면 boot-check 의 Release 빌드와 겹쳐 뺐다.

  # Android 도 같은 함정이었다 — 예전 Mobile Android Smoke 는 7/2 에 지워진 build:android:debug 를 불렀고,
  # MOBILE_ANDROID_GOOGLE_SERVICES_JSON_B64 시크릿이 없어 건너뛰어지고 있었을 뿐이다(넣는 순간 iOS 처럼 매 푸시 실패).
  # 안드로이드 기동 확인은 mobile-ota 의 boot-check 쪽에 따로 붙인다.
