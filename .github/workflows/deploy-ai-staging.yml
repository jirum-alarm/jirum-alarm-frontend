name: deploy-ai-staging

# apps/ai — dev-ai.jirum-alarm.com
#
# 트리거: main push (dev)
# 이미지: jirum-alarm-frontend-ai-dev
# dev 는 crawling-server-dev 를 본다(dev Dockerfile ARG 기본값).

on:
  push:
    branches:
      - main
    paths:
      - apps/ai/**
      - packages/**
  workflow_dispatch:

concurrency:
  group: ai-staging-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-k8s-image.yml
    secrets: inherit
    with:
      environment: staging
      image: tjsry0466/jirum-alarm-frontend-ai-dev
      manifest-image: tjsry0466/jirum-alarm-frontend-ai
      meta-tags: |
        type=ref,event=branch
        type=sha,prefix={{branch}}-,format=short
      tag-pattern: '^main-[0-9a-f]+$'
      dockerfile: apps/ai/deploy/development/Dockerfile
      kustomization: apps/frontend-ai/overlays/development/kustomization.yaml
      commit-label: ai-staging
