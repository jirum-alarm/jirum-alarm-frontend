name: deploy-ai-prod

# apps/ai — ai.jirum-alarm.com
#
# 트리거: v*.*.* 태그 push (운영 배포는 태그다 — main push 는 staging 뿐)
# 이미지: jirum-alarm-frontend-ai
# 운영 GraphQL 을 본다(Dockerfile ARG 기본값).

on:
  push:
    tags:
      - "v*.*.*"
    paths:
      - apps/ai/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

concurrency:
  group: ai-prod-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-k8s-image.yml
    secrets: inherit
    with:
      environment: production
      image: tjsry0466/jirum-alarm-frontend-ai
      manifest-image: tjsry0466/jirum-alarm-frontend-ai
      meta-tags: |
        type=semver,pattern={{version}}
        type=sha,prefix=v-,format=short
      tag-pattern: '^v-[0-9a-f]+$'
      dockerfile: apps/ai/deploy/production/Dockerfile
      kustomization: apps/frontend-ai/overlays/prod/kustomization.yaml
      commit-label: ai-prod
