name: deploy-beauty-web-prod

# apps/beauty-web — jirum-alarm.com/beauty (지름알림 뷰티, basePath /beauty)
#
# 트리거: v*.*.* 태그 push (운영 배포는 태그다 — main push 는 staging 뿐). web·ai 와 같은 방아쇠.
# 이미지: jirum-alarm-frontend-beauty-web
# 운영 GraphQL(crawling-server 내부 주소)을 본다(Dockerfile ARG 기본값, gitops configmap 이 덮을 수 있다).

on:
  push:
    tags:
      - "v*.*.*"
    paths:
      - apps/beauty-web/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

concurrency:
  group: beauty-web-prod-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-k8s-image.yml
    secrets: inherit
    with:
      environment: production
      image: tjsry0466/jirum-alarm-frontend-beauty-web
      manifest-image: tjsry0466/jirum-alarm-frontend-beauty-web
      meta-tags: |
        type=semver,pattern={{version}}
        type=sha,prefix=v-,format=short
      tag-pattern: '^v-[0-9a-f]+$'
      dockerfile: apps/beauty-web/deploy/production/Dockerfile
      kustomization: apps/frontend-beauty-web/overlays/prod/kustomization.yaml
      commit-label: beauty-web-prod
