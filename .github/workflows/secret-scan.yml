name: secret-scan

# 공개 레포 — 커밋이 곧 공개다. 2026-10-14 운영 Mongo root 비번이 scripts/ 에 커밋돼 교체·이력 재작성까지 갔다.
# GitHub 기본 push protection 은 사업자 토큰 패턴만 막아 DB URI 비번은 통과한다 → gitleaks + .gitleaks.toml 커스텀 룰.
# 이미 푸시된 뒤라 막지는 못하고 «즉시 알아채기»가 목적: 걸리면 값부터 교체(이력 삭제보다 먼저).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (이번 푸시/PR 구간만)
        env:
          GITLEAKS_VERSION: 8.30.1
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          from="${BASE:-$BEFORE}"
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$from" 2>/dev/null; then
            range="-1 $HEAD"
          else
            range="$from..$HEAD"
          fi
          echo "scan: $range"
          ./gitleaks git . -c .gitleaks.toml --redact --no-banner --log-opts="$range"
