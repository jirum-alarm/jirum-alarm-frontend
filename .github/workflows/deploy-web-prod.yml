name: deploy-web-prod

on:
  push:
    tags:
      - "v*.*.*"
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
      # Next 빌드(러너)와 실행 이미지(build-args)가 같은 값을 쓴다. NODE_ENV 는 빌드 스텝에만 —
      # 잡 전체에 두면 production 일 때 pnpm install 이 devDependencies 를 건너뛴다.
      NEXT_PUBLIC_SERVICE_URL: ${{ vars.NEXT_PUBLIC_SERVICE_URL }}
      API_URL: ${{ vars.API_URL }}
      # 웹 푸시 VAPID 공개키(B…). 비우면 Firebase SDK 기본 키 — 예전 값은 API 키(AIza…)라 웹 푸시 구독이 전부 실패했다(2026-10-11)
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ""
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ca-pub-3855723530036909
      NEXT_PUBLIC_ADSENSE_SLOT_PRODUCT_DETAIL: "9763036455"
      NEXT_PUBLIC_ADSENSE_SLOT_SEARCH_INFEED: "1939286674"
      # Sentry environment — 비우면 Sentry 를 끈다(로컬·CI 하네스 소음 차단, apps/web/src/shared/lib/sentry-filter.ts).
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Next 빌드를 이미지 밖(러너)에서 — 호스티드는 매 런 새 VM 이라 이미지 안 빌드는 컴파일 캐시가 늘 비었다.
      # pnpm store·.next/cache 를 actions 캐시로 런 사이에 보존한다. 실행 이미지는 runtime.Dockerfile(standalone 만).
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Next build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-web-prod-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-web-prod-${{ hashFiles('pnpm-lock.yaml') }}-
            next-web-prod-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=web...

      # node --test 0.5초. 웹 PR 검사(web-pr-check)는 PR 에서만 돌아 main 직접 푸시엔 테스트가 없었다.
      - name: Test web
        run: pnpm --filter web test

      - name: Build web
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
          # 소스맵 업로드(withSentryConfig). 없으면 업로드를 조용히 건너뛰어 7/30 이후 운영 스택이 전부 압축 코드 줄 번호였다.
          # 값은 앱과 같은 조직 토큰(EAS production env SENTRY_AUTH_TOKEN 사본, 2026-10-20).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm turbo run build --filter=web...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/tjsry0466/jirum-alarm-frontend-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Jirum Alarm Web Frontend
            org.opencontainers.image.description=Production deployment
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            maintainer=${{ github.repository_owner }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/deploy/runtime.Dockerfile
          platforms: linux/amd64
          # Harbor v2.10 은 buildx provenance 첨부물(attestation)을 index 자식이자 accessory 로 이중 등록해
          # 보존 정책·삭제가 412(referenced by others)로 막힌다 — 단일 매니페스트로 올린다.
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SERVICE_URL=${{ env.NEXT_PUBLIC_SERVICE_URL }}
            API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ env.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ env.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_ADSENSE_SLOT_PRODUCT_DETAIL=${{ env.NEXT_PUBLIC_ADSENSE_SLOT_PRODUCT_DETAIL }}
            NEXT_PUBLIC_ADSENSE_SLOT_SEARCH_INFEED=${{ env.NEXT_PUBLIC_ADSENSE_SLOT_SEARCH_INFEED }}
            NODE_ENV=${{ vars.NODE_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://jirum-alarm.com
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.INFRA_GITHUB_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: infra

      - name: Install yq
        run: |
          set -euo pipefail
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes manifest
        working-directory: infra
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          set -euo pipefail
          # kustomize overlay 의 images[].newTag 한 곳만 갱신한다.
          # (이전: server/.../deployment.yaml 의 image 라인 직접 치환 — 더는 ArgoCD 가 보지 않는 경로)
          # semver 태그라 매 배포마다 값이 달라져 ArgoCD 가 자연 rollout (어노테이션 트릭 불필요).
          KUSTOMIZATION="apps/frontend-web/overlays/production/kustomization.yaml"
          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/tjsry0466/jirum-alarm-frontend-web"
          export IMAGE_NAME NEW_TAG
          yq eval -i '(.images[] | select(.name == strenv(IMAGE_NAME)) | .newTag) = strenv(NEW_TAG)' "$KUSTOMIZATION"

      - name: Validate Kubernetes manifest
        working-directory: infra
        run: |
          set -euo pipefail
          yq eval '.' apps/frontend-web/overlays/production/kustomization.yaml > /dev/null

      - name: Commit files
        working-directory: infra
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add .
          # 같은 이미지 태그가 이미 들어가 있으면(같은 커밋을 다른 배포가 먼저 냄) 바꿀 게 없다 — 성공으로 끝낸다.
          if git diff --cached --quiet; then echo "image tag already up to date"; exit 0; fi
          # 무엇이 나갔나를 gitops git log 한 줄로 — 앱/환경·옛→새 태그·소스 커밋 (getmiso release 기록 차용, 2026-10-17)
          d=$(git diff HEAD -U0)
          what=$(git diff HEAD --name-only | head -1 | cut -d/ -f2,4)
          old=$(printf '%s\n' "$d" | sed -n 's/^-.*newTag: *//p' | head -1 | tr -d '"')
          new=$(printf '%s\n' "$d" | sed -n 's/^+.*newTag: *//p' | head -1 | tr -d '"')
          git commit -m "deploy($what): ${old:-?} → ${new:-?}" -m "$GITHUB_REPOSITORY@${GITHUB_SHA::8} $(printf '%s\n' "$HEAD_MSG" | head -1)"
          # 여러 앱 배포가 같은 gitops main 에 동시에 민다 — 뒤처지면 거절된다(2026-10-07 v1.47.0 web 이 admin 과 겹쳐 실패).
          # 따라잡고 다시 민다. 같은 파일을 동시에 고쳐 충돌이면 그때만 실패.
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            sleep $((i * 2))
          done
          exit 1
