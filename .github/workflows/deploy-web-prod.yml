name: deploy-web-prod

on:
  push:
    tags:
      - "v*.*.*"
    paths:
      - "apps/web/**"
      - "packages/**"

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    # 러너 전환은 커밋 없이: 레포 변수 WEB_RUNNER_LABEL(homelab = 셀프호스티드). 비우면 호스티드로 폴백.
    # 셀프호스티드는 로컬 도커에 레이어·.next/cache 가 남아 이미지 빌드 228초 → 97초(실측, 소스 변경 재빌드).
    runs-on: ${{ vars.WEB_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment:
      name: production
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: runner.environment != 'self-hosted'
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4

      # 셀프호스티드는 호스트 도커 데몬의 빌더(docker 드라이버)를 그대로 쓴다 — 캐시 마운트·레이어가 런 사이에 유지된다.
      # (기본 docker-container 드라이버는 매 런 새 빌더라 캐시가 사라짐. 데몬이 containerd 이미지 저장소라 provenance·sbom 도 그대로)
      - name: Set up Docker Buildx (self-hosted)
        if: runner.environment == 'self-hosted'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USER }}/jirum-alarm-frontend-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Jirum Alarm Web Frontend
            org.opencontainers.image.description=Production deployment
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            maintainer=${{ github.repository_owner }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/deploy/production/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SERVICE_URL=${{ vars.NEXT_PUBLIC_SERVICE_URL }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=ca-pub-3855723530036909
            NEXT_PUBLIC_ADSENSE_SLOT_PRODUCT_DETAIL=9763036455
            NEXT_PUBLIC_ADSENSE_SLOT_SEARCH_INFEED=1939286674
            NEXT_PUBLIC_ADSENSE_SLOT_PRODUCT_DETAIL_SIDE=2933904228
            API_URL=${{ vars.API_URL }}
            NODE_ENV=${{ vars.NODE_ENV }}
          provenance: true
          sbom: true
          cache-from: ${{ runner.environment != 'self-hosted' && 'type=gha' || '' }}
          cache-to: ${{ runner.environment != 'self-hosted' && 'type=gha,mode=max' || '' }}

  # 스캔은 결과를 Security 탭에 올리기만 하고 배포를 막지 않는다(exit-code 0) — 그래서 배포와 병렬로 돈다.
  # (빌드 잡 안에 있을 땐 배포가 스캔 ~50초를 기다렸다)
  scan:
    name: Trivy scan
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USER }}/jirum-alarm-frontend-web:${{ needs.build-and-push.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://jirum-alarm.com
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.INFRA_GITHUB_REPOSITORY }}
          ref: main
          token: ${{ secrets.ACTION_TOKEN }}
          path: infra

      - name: Install yq
        run: |
          set -euo pipefail
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes manifest
        working-directory: infra
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          set -euo pipefail
          # kustomize overlay 의 images[].newTag 한 곳만 갱신한다.
          # (이전: server/.../deployment.yaml 의 image 라인 직접 치환 — 더는 ArgoCD 가 보지 않는 경로)
          # semver 태그라 매 배포마다 값이 달라져 ArgoCD 가 자연 rollout (어노테이션 트릭 불필요).
          KUSTOMIZATION="apps/frontend-web/overlays/production/kustomization.yaml"
          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USER }}/jirum-alarm-frontend-web"
          export IMAGE_NAME NEW_TAG
          yq eval -i '(.images[] | select(.name == strenv(IMAGE_NAME)) | .newTag) = strenv(NEW_TAG)' "$KUSTOMIZATION"

      - name: Validate Kubernetes manifest
        working-directory: infra
        run: |
          set -euo pipefail
          yq eval '.' apps/frontend-web/overlays/production/kustomization.yaml > /dev/null

      - name: Commit files
        working-directory: infra
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add .
          # 같은 이미지 태그가 이미 들어가 있으면(같은 커밋을 다른 배포가 먼저 냄) 바꿀 게 없다 — 성공으로 끝낸다.
          if git diff --cached --quiet; then echo "image tag already up to date"; exit 0; fi
          git commit -m "Update image tag"
          # 여러 앱 배포가 같은 gitops main 에 동시에 민다 — 뒤처지면 거절된다(2026-10-07 v1.47.0 web 이 admin 과 겹쳐 실패).
          # 따라잡고 다시 민다. 같은 파일을 동시에 고쳐 충돌이면 그때만 실패.
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            sleep $((i * 2))
          done
          exit 1
