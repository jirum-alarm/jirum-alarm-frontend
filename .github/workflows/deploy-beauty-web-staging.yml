name: deploy-beauty-web-staging

# apps/beauty-web — dev.jirum-alarm.com/beauty (지름알림 뷰티, basePath /beauty)
#
# 트리거: main push (dev) — apps/beauty-web·packages 변경 시
# 이미지: jirum-alarm-frontend-beauty-web-dev (gitops overlay 가 name → newName 으로 바꿔 끼운다 — ai 와 같은 방식)
# dev 는 crawling-server-dev 를 본다(dev Dockerfile ARG 기본값, gitops configmap 이 덮을 수 있다).

on:
  push:
    branches:
      - main
    paths:
      - apps/beauty-web/**
      - packages/**
  workflow_dispatch:

concurrency:
  group: beauty-web-staging-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-k8s-image.yml
    secrets: inherit
    with:
      environment: staging
      image: tjsry0466/jirum-alarm-frontend-beauty-web-dev
      manifest-image: tjsry0466/jirum-alarm-frontend-beauty-web
      meta-tags: |
        type=ref,event=branch
        type=sha,prefix={{branch}}-,format=short
      tag-pattern: '^main-[0-9a-f]+$'
      dockerfile: apps/beauty-web/deploy/development/Dockerfile
      kustomization: apps/frontend-beauty-web/overlays/development/kustomization.yaml
      commit-label: beauty-web-staging
